<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>{% block title %}PHAGE Test Site{% endblock %}</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', sans-serif; background: #0f172a; color: #e2e8f0; min-height: 100vh; }
    nav {
      background: #1e293b;
      border-bottom: 1px solid #334155;
      padding: 1rem 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .nav-brand { font-size: 1.2rem; font-weight: 700; color: #38bdf8; text-decoration: none; }
    .nav-links { display: flex; gap: 1.5rem; }
    .nav-links a { color: #94a3b8; text-decoration: none; font-size: .9rem; transition: color .2s; }
    .nav-links a:hover { color: #38bdf8; }
    .container { max-width: 900px; margin: 3rem auto; padding: 0 1.5rem; }
    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 2rem;
      margin-bottom: 1.5rem;
    }
    h1 { font-size: 1.8rem; font-weight: 700; margin-bottom: 1rem; }
    h2 { font-size: 1.3rem; font-weight: 600; margin-bottom: .75rem; color: #38bdf8; }
    input[type=text], input[type=password] {
      width: 100%;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 8px;
      color: #e2e8f0;
      padding: .75rem 1rem;
      font-size: 1rem;
      margin-bottom: 1rem;
    }
    input:focus { outline: none; border-color: #38bdf8; }
    button, .btn {
      background: #38bdf8;
      color: #0f172a;
      font-weight: 700;
      padding: .75rem 1.5rem;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: .95rem;
      text-decoration: none;
      display: inline-block;
      transition: background .2s;
    }
    button:hover, .btn:hover { background: #0ea5e9; }
    .badge {
      display: inline-block;
      padding: .25rem .75rem;
      border-radius: 999px;
      font-size: .75rem;
      font-weight: 600;
    }
    .badge-green  { background: rgba(34,197,94,.15);  color: #22c55e; border: 1px solid rgba(34,197,94,.3); }
    .badge-red    { background: rgba(239,68,68,.15);  color: #ef4444; border: 1px solid rgba(239,68,68,.3); }
    .badge-yellow { background: rgba(234,179,8,.15);  color: #eab308; border: 1px solid rgba(234,179,8,.3); }
    .alert { padding: .75rem 1rem; border-radius: 8px; margin-bottom: 1rem; font-size: .9rem; }
    .alert-danger  { background: rgba(239,68,68,.1);  border: 1px solid rgba(239,68,68,.3);  color: #fca5a5; }
    .alert-success { background: rgba(34,197,94,.1);  border: 1px solid rgba(34,197,94,.3);  color: #86efac; }
    .phage-banner {
      position: fixed; bottom: 1rem; right: 1rem;
      background: #1e293b; border: 1px solid #38bdf8;
      border-radius: 10px; padding: .6rem 1rem;
      font-size: .78rem; color: #38bdf8;
      display: flex; align-items: center; gap: .5rem;
    }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: #22c55e; animation: blink 1.5s infinite; }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:.3} }
  </style>
</head>
<body>
  <nav>
    <a class="nav-brand" href="/">🛡️ PHAGE Test Site</a>
    <div class="nav-links">
      <a href="/">Home</a>
      <a href="/login/">Login</a>
      <a href="/search/">Search</a>
      <a href="/admin-panel/">Admin</a>
      <a href="/api/data/">API</a>
    </div>
  </nav>

  <div class="container">
    {% block content %}{% endblock %}
  </div>

  <div class="phage-banner">
    <div class="dot"></div>
    PHAGE monitoring active
  </div>
</body>
</html>
