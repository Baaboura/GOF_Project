{% extends 'base.html' %}
{% block title %}Login — PHAGE Test Site{% endblock %}
{% block content %}
<div class="card" style="max-width:450px;margin:0 auto;">
  <h1>🔐 Login</h1>
  {% if message %}
    <div class="alert {% if 'success' in message %}alert-success{% else %}alert-danger{% endif %}">
      {{ message }}
    </div>
  {% endif %}
  <form method="POST">
    {% csrf_token %}
    <label style="font-size:.85rem;color:#94a3b8;display:block;margin-bottom:.35rem;">Username</label>
    <input type="text" name="username" placeholder="Enter username" />
    <label style="font-size:.85rem;color:#94a3b8;display:block;margin-bottom:.35rem;">Password</label>
    <input type="password" name="password" placeholder="Enter password" />
    <button type="submit" style="width:100%;">Login</button>
  </form>
  <p style="color:#64748b;font-size:.8rem;margin-top:1rem;text-align:center;">
    Test credentials: admin / admin123
  </p>
</div>
{% endblock %}
